name: Android CI
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew test --no-daemon
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DiscGolfTour-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release (public download link)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          cp app/build/outputs/apk/debug/app-debug.apk DiscGolfTour-debug.apk
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" DiscGolfTour-debug.apk --prerelease --target "$GITHUB_SHA" --title "$TAG" --notes "Debug build of $GITHUB_SHA"
